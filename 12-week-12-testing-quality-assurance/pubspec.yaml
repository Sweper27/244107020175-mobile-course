name: campus_notification
description: "Campus Notification - Jobsheet 12: Testing & Quality Assurance"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking & Caching
  dio: ^5.7.0

  # Image Optimization & Caching
  cached_network_image: ^3.4.1

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Google Generative AI & Environment Configuration
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Integration testing (JS 12)
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
